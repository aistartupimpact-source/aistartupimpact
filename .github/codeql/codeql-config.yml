name: "AI Startup Impact CodeQL Config"

queries:
  - uses: security-extended

query-filters:
  # Auth routes use user-provided credentials to gate access — this is how authentication works.
  - exclude:
      id: js/user-controlled-bypass
  # Form draft autosave in localStorage (employer onboarding, startup edit) stores non-secret
  # business data (company name, employee count, tagline). Not credentials or tokens.
  - exclude:
      id: js/clear-text-storage-of-sensitive-information
  # OG metadata scraper validates URLs against a blocklist (private IPs, localhost, non-HTTP)
  # and disables redirects. CodeQL can't trace through the validation function.
  - exclude:
      id: js/request-forgery
  # React JSX automatically escapes interpolated values in attributes — DOM text is never
  # reinterpreted as raw HTML. CodeQL doesn't model React's built-in XSS protection.
  - exclude:
      id: js/xss-through-dom
