name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  # Dummy values for build (Prisma generate needs DATABASE_URL syntax but won't connect)
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
  NEXTAUTH_SECRET: "ci-secret"
  NEXTAUTH_URL: "http://localhost:3000"
  ADMIN_NEXTAUTH_URL: "http://localhost:3001"
  NEXT_PUBLIC_API_URL: "http://localhost:4000/v1"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  JWT_SECRET: "ci-jwt-secret"
  REFRESH_SECRET: "ci-refresh-secret"
  FOUNDER_JWT_SECRET: "ci-founder-secret"
  USER_JWT_SECRET: "ci-user-secret"
  IP_HASH_SALT: "ci-ip-hash-salt-placeholder-value"
  RESEND_API_KEY: "re_placeholder"
  RESEND_FROM_EMAIL: "no-reply@example.com"
  RESEND_FROM_NAME: "CI"
  RESEND_NEWSLETTER_EMAIL: "newsletter@example.com"
  RESEND_NEWSLETTER_NAME: "CI Newsletter"
  RESEND_REPLY_TO: "reply@example.com"
  R2_ACCOUNT_ID: "placeholder"
  R2_ACCESS_KEY_ID: "placeholder"
  R2_SECRET_ACCESS_KEY: "placeholder"
  R2_BUCKET_NAME: "placeholder"
  R2_PUBLIC_URL: "https://placeholder.r2.dev"
  GOOGLE_CLIENT_ID: "placeholder.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "placeholder"
  GOOGLE_REDIRECT_URI: "http://localhost:3000/api/auth/callback"
  GOOGLE_REDIRECT_URI_USER: "http://localhost:3000/api/user/auth/callback"
  UPSTASH_REDIS_REST_URL: ""
  UPSTASH_REDIS_REST_TOKEN: ""
  MEILI_URL: ""
  MEILI_MASTER_KEY: ""
  NEXT_PUBLIC_GA_ID: ""
  NEXT_PUBLIC_SENTRY_DSN: ""

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Lint
        run: npx turbo run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run tests
        run: npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build all apps
        run: npx turbo run build

      - name: Upload build artifacts (web)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 1

      - name: Upload build artifacts (admin)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: admin-build
          path: apps/admin/.next
          retention-days: 1
